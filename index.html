<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROMEiRO — Desenvolvimento Web</title>

  <meta

    content="Sites profissionais, modernos e personalizados para negócios."

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"

  <style>

    :root {
      --bg: #0b0d0c;
      --bg2: #111412;
      --text: #f5f5f1;
      --muted: #a8aca7;
      --green: #b8d89f;
      --green-dark: #8eaf76;
      --line: rgba(255,255,255,.10);
      --card: rgba(255,255,255,.045);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       NAVBAR
    ========================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;

      padding: 22px 6%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(11,13,12,.72);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .logo {
      font-weight: 700;
      letter-spacing: 4px;
      font-size: 17px;
    }

    .logo span {
      color: var(--green);
    }

    .nav-links {
      display: flex;
      gap: 32px;
      font-size: 14px;
      color: var(--muted);
    }

    .nav-links a {
      transition: .3s;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-contact {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .instagram-nav {
      color: var(--muted);
      font-size: 13px;
      transition: .3s;
    }

    .instagram-nav:hover {
      color: white;
    }

    .nav-button {
      padding: 11px 18px;

      border: 1px solid rgba(184,216,159,.4);
      border-radius: 30px;

      color: var(--green);
      font-size: 13px;

      transition: .3s;
    }

    .nav-button:hover {
      background: var(--green);
      color: #101410;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;

      padding: 160px 7% 90px;

      display: grid;
      grid-template-columns: 1.05fr .95fr;

      align-items: center;
      gap: 70px;

      position: relative;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 500px;
      height: 500px;

      background: var(--green);
      opacity: .07;

      filter: blur(130px);

      border-radius: 50%;

      top: 10%;
      left: -150px;

      pointer-events: none;
    }

    .eyebrow {
      color: var(--green);

      font-size: 12px;

      letter-spacing: 4px;

      text-transform: uppercase;

      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(48px, 7vw, 88px);

      line-height: .98;

      letter-spacing: -4px;

      max-width: 850px;
    }

    h1 em {
      font-family: "Playfair Display", serif;

      font-weight: 500;

      color: var(--green);
    }

    .hero-text {
      max-width: 570px;

      margin-top: 30px;

      color: var(--muted);

      font-size: 17px;

      line-height: 1.7;
    }

    .hero-buttons {
      display: flex;

      gap: 14px;

      margin-top: 38px;

      flex-wrap: wrap;
    }

    .primary {
      background: var(--green);

      color: #101410;

      padding: 15px 24px;

      border-radius: 4px;

      font-weight: 600;

      transition: .3s;
    }

    .primary:hover {
      transform: translateY(-3px);

      background: #c8e6b1;
    }

    .secondary {
      padding: 15px 24px;

      border: 1px solid var(--line);

      border-radius: 4px;

      color: var(--text);

      transition: .3s;
    }

    .secondary:hover {
      border-color: var(--green);

      color: var(--green);
    }


    /* =========================
       WEBSITE MOCKUP
    ========================= */

      position: relative;

      width: 100%;

      max-width: 580px;

      margin-left: auto;
    }
